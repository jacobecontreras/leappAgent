<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAPP Agent</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <img src="assets/logo.png" alt="LEAPP Agent" class="header-logo">
            <button id="settingsButton" class="icon-button" title="Settings">
                <img src="assets/settings-icon.svg" alt="Settings" class="icon-img">
            </button>
        </header>

        <div id="healthBanner" class="health-banner hidden">
            <span id="healthBannerText">Ollama is not reachable. Install Ollama and pull a model to get started.</span>
            <button id="healthRetryBtn" class="banner-retry-btn">Retry</button>
        </div>

        <main class="chat-content">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-welcome" id="chatWelcome">
                    <img src="assets/logo.png" alt="LEAPP Agent" class="chat-welcome-logo">
                </div>
            </div>

            <div class="chat-input">
                <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <div class="input-actions">
                    <button id="uploadButton" class="upload-button" title="Upload report">
                        <img src="assets/attachment.svg" alt="Upload" class="upload-icon">
                        <span>Upload report</span>
                    </button>
                    <button id="sendButton" class="send-button">
                        <img src="assets/send-arrow.svg" alt="Send" class="send-icon">
                        <img src="assets/stop-icon.svg" alt="Stop" class="stop-icon">
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="settingsCloseBtn" class="icon-button" title="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="chatModelSelect">Chat model</label>
                    <select id="chatModelSelect" class="model-select"></select>
                    <span class="setting-description">Tool-capable models installed in Ollama</span>
                </div>

                <div class="input-group">
                    <label for="embedModelSelect">Embedding model</label>
                    <select id="embedModelSelect" class="model-select"></select>
                    <span class="setting-description">Changing this requires re-uploading reports</span>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-label">Disable embedding</span>
                        <span class="setting-description">Skip vector indexing for faster report loading</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="disableEmbeddingToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-label">Clear all data</span>
                        <span class="setting-description">Delete all processed reports and embeddings</span>
                    </div>
                    <button id="clearDataBtn" class="btn-danger">Clear Data</button>
                </div>

                <div id="settingsStatus" class="settings-status"></div>
            </div>
        </div>
    </div>

    <script src="vendor/marked.min.js"></script>
    <script src="utils/UIManager.js"></script>
    <script src="services/AIService.js"></script>
    <script src="services/UploadService.js"></script>
    <script src="components/Message.js"></script>
    <script src="components/Settings.js"></script>
    <script src="components/Chat.js"></script>
    <script src="main.js"></script>
</body>

</html>
